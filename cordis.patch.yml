            input: [text, image]
            reasoningEfforts:
              off:
              low: low
              medium: medium
              high: high
              max: max
          - id: deepseek-v3-2-volc
            name: DeepSeek V3.2 Volc
            contextWindow: 96000
            maxTokens: 32000
            reasoningEfforts:
              off:
              low: low
              medium: medium
              high: high
              max: max
          # Zhipu GLM
          - id: glm-5.1
            name: GLM 5.1
            contextWindow: 200000
            maxTokens: 48000
            input: [text, image]
            reasoningEfforts:
              off:
              low: low
              medium: medium
              high: high
              max: max
          - id: glm-5.2
