      # TraeWork CN channel (v0.8.x): OAuth subscription quota via the
      # plugin's OpenAI<->Trae translation gateway at 127.0.0.1:3902
      # (default; must match traeBridgePort).
      #
      # 0.8.7 NOTE — no static trae base here anymore (dsh 0.1.1-rc.2
      # adaptation): llm-pi-ai now REJECTS a non-catalog route with an empty
      # models list at apply time (throwing takes down the whole llm-pi-ai
      # fiber), so the "empty-list shadowing" trick for disabling the channel
      # no longer works. Route EXISTENCE is now the whole story, owned by the
      # settings.yaml mirror index.js maintains (llm-pi-ai.providers.trae as a
      # COMPLETE block): enabled+synced -> full block (displayName/api/
      # baseURL/headers/models, baseURL following traeBridgePort);
      # disabled/unsynced -> the block is DELETED (route gone, picker hides
      # the channel, no restart). With no patch-layer base, deletion leaves
      # no stale fallback to shadow. Same sentinel-Authorization mechanics
      # as the codebuddy route: the gateway replaces the static header per
      # request with the resolved OAuth credential (Cloud-IDE-JWT +
      # x-cloudide-token). reasoning_effort dialect unverified against the
      # Trae gateway — compat left off until the live probe pins it
      # (docs/reverse/trae-cloud-api.md).
      # UPGRADE NOTE: a settings.yaml trae block written by <=0.8.5 carries
      # only the models path (it leaned on this base for the other fields);
      # remove it before the first 0.1.1-rc.2 boot, or llm-pi-ai fails on
      # the missing baseURL before this plugin can rewrite it.

- id: agent-default-model
  config:
    provider: codebuddy
    model: deepseek-v3

- id: web
  config:
    searchProvider: codebuddy
    fetchProvider: codebuddy
