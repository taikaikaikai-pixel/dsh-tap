          # Tencent Hunyuan
          # 2026-09-22：hy3 / hy3-preview 的 off 档撤销——省略参数两模型都照常
          # 思考（六臂 reason≈510–625），off 已成假开关（宿主选择器会出 Off）。
          - id: hy3
            name: Hunyuan Hy3
