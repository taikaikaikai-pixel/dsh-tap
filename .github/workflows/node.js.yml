# 离线回归套件（同款命令已在本地全绿预跑）。不带 --list 的 verify-models 与各 probe-* 脚本
# 需要真实凭据/真实上游，不进 CI——清单见 AGENTS.md「常用命令」。
name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]   # 项目要求 Node ≥ 22（纯 ESM）

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: node scripts/verify-models.mjs --list
    - run: node scripts/verify-bridge.mjs
    - run: node scripts/verify-rotation.mjs
    - run: node scripts/verify-core-generic.mjs
    - run: node scripts/verify-providers.mjs
    - run: node scripts/verify-trae-provider.mjs
    - run: node scripts/verify-qoder-provider.mjs
    - run: node scripts/verify-host-config.mjs
    - run: node scripts/verify-agents-md.mjs
    - name: desktop 适配可执行验收·结构闸门（goal 验收的机器可判恒真部分）
      # --structural：CI 只锁 A 组离线结构性不变量（index.js 无 desktop 特化 / 差异收口 / goal 锚点）——
      # 它们必须恒真、与适配进度无关。B 组结果断言（codebuddy 已接入）在适配完成前必然 FAIL，
      # 不进 CI 恒闸门；C 组活实例断言恒 SKIP（由探针/GUI 套件承担，不伪造）。
      run: node scripts/verify-desktop-acceptance.mjs --structural
    - name: AGENTS.md 体积硬闸门（agents-md lint，PyPI agent-context-md）
      # --threshold 0：质量评分面向英文模板结构（## Commands/Testing/Boundaries），对本仓库的中文薄索引恒 0 分；
      # 只用它的硬闸门（行数/字节/占位符），评分不参与判定（实测：不带 --threshold 0 时预算全过也 exit 1）
      run: |
        python -m pip install --quiet agent-context-md
        agents-md lint --check --threshold 0 --max-lines 150 --max-bytes 12000 --fail-on-placeholder
    - name: AGENTS.md 陈旧引用/膨胀守卫（alint agent-context@v1）
      uses: asamarts/alint@v0.16.1
      with:
        format: github
        fail-on-warning: true
